[workspace]
members = [
  "crates/swarm-cli",
  "crates/swarm-api",
  "crates/swarm-application",
  "crates/swarm-domain",
  "crates/swarm-persistence",
  "crates/swarm-support",
  "crates/swarm-release-tool",
  "crates/swarm-terminal",
  "crates/swarm-terminal-host",
]
resolver = "3"

[workspace.package]
version = "1.14.3"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/miopea/swarm-next"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
futures-util = "0.3"
base64ct = { version = "1.8", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
ed25519-dalek = "2.2"
rmcp = { version = "3.1.2", default-features = false, features = ["server", "transport-streamable-http-server"] }
getrandom = "0.3"
nix = { version = "0.28", features = ["user", "fs"] }
portable-pty = "0.9.0"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["backup", "bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "multipart"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v7"] }
url = "2"
vt100 = "0.16.2"
web-push-native = { version = "0.5.0", default-features = false, features = ["vapid"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# ⚠️ DEPENDENCIES ARE OPTIMISED; OUR OWN CRATES ARE NOT.
#
# Measured 2026-09-17: `cargo test --workspace --all-features` took 1129s with
# EVERYTHING ALREADY COMPILED — compiling the workspace is only 84s, so test
# EXECUTION was the whole of the ~19 minute verify. swarm-persistence alone ran
# 833 tests in 670s and swarm-api 663 in 260s.
#
# The cause is that `rusqlite` is pulled in with `bundled`, so SQLite's C source
# is compiled into the test binaries — and with no profile override it built at
# opt-level 0. Every in-memory database in every test ran unoptimised C, and the
# persistence suite stands up a database and builds the whole schema per test.
#
# `package."*"` is dependencies ONLY. Our crates stay at opt-level 0 so an
# incremental rebuild of code being edited is unchanged; dependencies are cached
# after one rebuild, so the cost is paid once rather than per run.
[profile.dev.package."*"]
opt-level = 2
