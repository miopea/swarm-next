name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Rust distribution download failed; retrying ($attempt/3)"
            sleep $((attempt * 5))
          done
      - run: rustup override set 1.97.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --release -p swarm-terminal resize_updates_pty_and_canonical_dimensions

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # THE ONLY STATE THIS JOB KEEPS: the date the audit last actually reached
      # the advisory database. It exists so a fail-open cannot become permanent
      # — see the banner-is-bounded note in scripts/audit-web.sh. Rolling key,
      # because a cache entry is immutable once saved and a fixed key would
      # freeze the first date forever, which is the same defect wearing a hat.
      - uses: actions/cache@v4
        with:
          path: web/.audit-web-last-success
          key: audit-web-last-success-${{ github.run_id }}
          restore-keys: audit-web-last-success-
      # A REGISTRY OUTAGE IS NOT AN AUDIT FINDING, and `pnpm audit` reported
      # both as exit 1. See scripts/audit-web.sh — a real advisory still fails
      # this job; an unreachable advisory database says so instead of pretending
      # to be a verdict, and fails once it has been saying so for a week.
      - run: sh ../scripts/audit-web.sh
        working-directory: web
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:dogfood
      - run: pnpm build

  rust-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # ⚠️ NOT rustsec/audit-check. THAT ACTION BUILDS cargo-audit FROM SOURCE
      # WITHOUT --locked, so cargo resolves the newest semver-compatible
      # dependency set rather than the one cargo-audit was tested against. On
      # 2026-09-04 that set contained a tinyvec that will not compile at all
      # ("error: cannot find macro `vec` in this scope"), and the required
      # rust-audit check failed on every commit for reasons no change to this
      # repository could cause or fix.
      #
      # --locked builds cargo-audit's own lockfile. Measured on this box: the
      # action's build fails, `cargo install cargo-audit --locked` installs
      # 0.22.2 and scans 400 crate dependencies clean.
      - run: cargo install cargo-audit --locked --version 0.22.2
      # web-push-native's VAPID feature pulls jwt-simple's optional RSA
      # implementation into Cargo.lock, but Swarm constructs only ES256 keys.
      # RUSTSEC-2023-0071 has no patched rsa release and applies to observable
      # RSA private-key operations, which this binary never performs. Keep the
      # exception visible and scoped to this one ID.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # THE FINGERPRINT TEST NEEDS THE REGISTRY, AND WITHOUT THIS THE JOB WAS
      # PASSING WITHOUT MEASURING ANYTHING.
      #
      # worker-engine-build-id.sh runs `cargo tree --locked --offline`. On a
      # fresh runner nothing is fetched, so that fails — and in the form this
      # job was green against, it failed inside a pipeline whose exit status
      # came from `cut`. The script emitted a fingerprint computed with NO
      # dependency tree at all: measured on a cold registry it returns
      # 1670d7aa5769 and exits 0. Stable, plausible, and covering none of what
      # it claims, which is the exact failure its own header calls the worst
      # one it can have.
      #
      # The script now refuses instead of guessing, which is what turned this
      # job red and is how the hole was found. Fetching first is what lets it
      # measure the thing it is supposed to measure.
      - run: cargo fetch --locked
      - run: packaging/linux/test-worker-engine-build-id.sh
      - run: packaging/linux/test-package-lifecycle.sh
      - run: bash packaging/linux/test-worker-return-preparation.sh
