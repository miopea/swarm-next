name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Rust distribution download failed; retrying ($attempt/3)"
            sleep $((attempt * 5))
          done
      - run: rustup override set 1.97.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --release -p swarm-terminal resize_updates_pty_and_canonical_dimensions

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:dogfood
      - run: pnpm build

  rust-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # web-push-native's VAPID feature pulls jwt-simple's optional RSA
          # implementation into Cargo.lock, but Swarm constructs only ES256
          # keys. RUSTSEC-2023-0071 has no patched rsa release and applies to
          # observable RSA private-key operations, which this binary never
          # performs. Keep the exception visible and scoped to this one ID.
          ignore: RUSTSEC-2023-0071

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # THE FINGERPRINT TEST NEEDS THE REGISTRY, AND WITHOUT THIS THE JOB WAS
      # PASSING WITHOUT MEASURING ANYTHING.
      #
      # worker-engine-build-id.sh runs `cargo tree --locked --offline`. On a
      # fresh runner nothing is fetched, so that fails — and in the form this
      # job was green against, it failed inside a pipeline whose exit status
      # came from `cut`. The script emitted a fingerprint computed with NO
      # dependency tree at all: measured on a cold registry it returns
      # 1670d7aa5769 and exits 0. Stable, plausible, and covering none of what
      # it claims, which is the exact failure its own header calls the worst
      # one it can have.
      #
      # The script now refuses instead of guessing, which is what turned this
      # job red and is how the hole was found. Fetching first is what lets it
      # measure the thing it is supposed to measure.
      - run: cargo fetch --locked
      - run: packaging/linux/test-worker-engine-build-id.sh
      - run: packaging/linux/test-package-lifecycle.sh
      - run: bash packaging/linux/test-worker-return-preparation.sh
