name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Rust distribution download failed; retrying ($attempt/3)"
            sleep $((attempt * 5))
          done
      - run: rustup override set 1.97.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --release -p swarm-terminal resize_updates_pty_and_canonical_dimensions

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:dogfood
      - run: pnpm build

  rust-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/linux/test-package-lifecycle.sh
